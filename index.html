<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182b40">
  <meta name="description" content="自分専用のシンプルなタスク管理アプリ">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>MY TASKS</title>
</head>
<body>
  <header class="hero">
    <div class="brand"><span class="brand-mark">✓</span> MY TASKS <span class="app-label">PERSONAL</span></div>
    <p class="eyebrow">YOUR DAILY ORGANIZER</p>
    <h1>今日のタスク</h1>
    <p class="subtitle">やるべきことを、ひとつずつ。</p>
    <section class="stats" aria-label="タスクの状況">
      <div class="stat"><strong id="totalCount">0</strong><span>合計</span></div>
      <div class="stat"><strong id="openCount">0</strong><span>未完了</span></div>
      <div class="stat"><strong id="doneCount">0</strong><span>完了</span></div>
    </section>
    <div class="progress-meta"><span>今日の達成率</span><strong id="progressLabel">0%</strong></div>
    <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
  </header>

  <main class="main">
    <section class="panel add-panel">
      <div class="section-heading"><h2>タスクを追加</h2><span class="heading-icon">＋</span></div>
      <form id="taskForm">
        <label class="sr-only" for="taskInput">タスク名</label>
        <input id="taskInput" maxlength="100" placeholder="例：明日の予定を確認する" autocomplete="off" required>
        <div class="form-row">
          <label for="priorityInput">優先度</label>
          <select id="priorityInput">
            <option value="high">高</option>
            <option value="medium" selected>中</option>
            <option value="low">低</option>
          </select>
          <button class="add-button" type="submit">＋ 追加する</button>
        </div>
      </form>
    </section>

    <section class="task-section">
      <div class="list-heading"><h2>タスク一覧</h2><span id="visibleCount" class="count-pill">0件</span></div>
      <nav class="filters" aria-label="タスクの絞り込み">
        <button class="filter active" data-filter="all">すべて</button>
        <button class="filter" data-filter="open">未完了</button>
        <button class="filter" data-filter="done">完了済み</button>
      </nav>
      <div id="taskList" class="task-list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <strong>タスクはまだありません</strong>
        <span>上のフォームからタスクを追加しましょう。</span>
      </div>
      <button id="clearDone" class="clear-button" type="button" hidden>完了済みを一括削除</button>
    </section>
    <p class="local-note"><span>●</span> データはこの端末内に保存されます</p>
  </main>
  <footer>MY TASKS <span>·</span> YOUR PRIVATE TO-DO LIST</footer>
  <script src="./app.js" defer></script>
</body>
</html>
